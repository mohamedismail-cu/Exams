<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Timer</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 480px; width: 100%; text-align: center; }
    h2 { color: #1a73e8; margin-top: 0; }
    .timer-display { font-size: 36px; font-weight: bold; color: #202124; margin: 20px 0; padding: 15px; background: #e8f0fe; border-radius: 8px; border: 1px solid #aecbfa; }
    .btn { background-color: #1a73e8; color: white; border: none; padding: 14px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; font-size: 16px; }
    .btn:hover { background-color: #1557b0; }
    .btn-secondary { background-color: #34a853; }
    .btn-secondary:hover { background-color: #2d8e47; }
    .note { font-size: 13px; color: #5f6368; margin-top: 15px; text-align: left; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Examination Portal</h2>
    
    <!-- State 1: Start Button -->
    <div id="start-state">
      <p>Click below to start your Exam. The exam will open immediately.</p>
      <button class="btn" onclick="startExam()">Start Exam & Open Form</button>
    </div>

    <!-- State 2: Active Exam Timer -->
    <div id="active-state" style="display: none;">
      <p>Exam in Progress</p>
      <div id="timer" class="timer-display">--:--:--</div>
      <button class="btn btn-secondary" onclick="openFloatingTimer()">Pop-out Floating Timer</button>
      <button class="btn" style="margin-top: 10px; background-color: #5f6368;" onclick="goToForm()">Go to Google Form</button>
      <div class="note">
        If you close your browser by accident, reopen this page to recover your active session.
      </div>
    </div>
  </div>

  <script>
    // =========================================================
    // CONFIGURATION
    // =========================================================
    const EXAM_ID = "physics_exam_unit_1";       // Unique per exam
    const DURATION_MINUTES = 10;                  // Time limit in minutes
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfG1KAYhg-do9b3x9kfGnzeb_PtjStgFpsyL-cZJt_NV9uRGA/viewform?usp=dialog";  // Your Google Form Link
    // =========================================================

    const STORAGE_KEY = 'exam_start_time_' + EXAM_ID;
    const TOTAL_SECONDS = DURATION_MINUTES * 60;

    function init() {
      let startTime = localStorage.getItem(STORAGE_KEY);
      if (startTime) {
        showActiveTimer(parseInt(startTime));
      }
    }

    function startExam() {
      let startTime = Date.now();
      localStorage.setItem(STORAGE_KEY, startTime);
      
      // Open floating timer pop-up window
      openFloatingTimer();
      
      // Redirect current tab straight to the Google Form
      window.location.href = FORM_URL;
    }

    function goToForm() {
      window.location.href = FORM_URL;
    }

    function openFloatingTimer() {
      // Launch a small 350x200 floating widget window
      const popup = window.open(
        '', 
        'TimerWidget', 
        'width=350,height=200,top=50,left=50,resizable=yes,scrollbars=no,status=no'
      );

      if (popup) {
        popup.document.write(`
          <!DOCTYPE html>
          <html>
          <head>
            <title>Timer</title>
            <style>
              body { font-family: Arial, sans-serif; background: #1a73e8; color: white; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; text-align: center; }
              h3 { margin: 0 0 5px 0; font-size: 14px; opacity: 0.9; }
              #time { font-size: 32px; font-weight: bold; font-family: monospace; }
            </style>
          </head>
          <body>
            <h3>TIME REMAINING</h3>
            <div id="time">--:--:--</div>
            <script>
              const STORAGE_KEY = '${STORAGE_KEY}';
              const TOTAL_SECONDS = ${TOTAL_SECONDS};
              
              function update() {
                let startTime = localStorage.getItem(STORAGE_KEY);
                if (!startTime) return;
                
                let elapsed = Math.floor((Date.now() - parseInt(startTime)) / 1000);
                let remaining = TOTAL_SECONDS - elapsed;
                
                if (remaining <= 0) {
                  document.getElementById('time').innerText = "EXPIRED";
                  document.getElementById('time').style.color = "#ff4d4d";
                  return;
                }
                
                let h = Math.floor(remaining / 3600);
                let m = Math.floor((remaining % 3600) / 60);
                let s = remaining % 60;
                
                document.getElementById('time').innerText = 
                  String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
              }
              setInterval(update, 1000);
              update();
            <\/script>
          </body>
          </html>
        `);
      }
    }

    function showActiveTimer(startTime) {
      document.getElementById('start-state').style.display = 'none';
      document.getElementById('active-state').style.display = 'block';

      function updateTimer() {
        const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
        const remainingSeconds = TOTAL_SECONDS - elapsedSeconds;

        const timerElement = document.getElementById('timer');

        if (remainingSeconds <= 0) {
          timerElement.innerText = "TIME EXPIRED";
          return;
        }

        const hours = Math.floor(remainingSeconds / 3600);
        const minutes = Math.floor((remainingSeconds % 3600) / 60);
        const seconds = remainingSeconds % 60;

        timerElement.innerText = 
          `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }

      updateTimer();
      setInterval(updateTimer, 1000);
    }

    init();
  </script>
</body>
</html>
